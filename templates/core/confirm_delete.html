{% extends 'base.html' %}

{% block title %}O'chirish · Anvar Bog'cha{% endblock %}
{% block app_title %}O'chirish{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <div class="page-kicker">Tasdiqlash</div>
      <h1 class="page-title">O'chirishni tasdiqlang</h1>
    </div>
  </div>

  <div class="app-card p-3 p-lg-4">
    <div class="alert alert-warning mb-4">
      <strong>{{ object }}</strong> yozuvini o'chirmoqchimisiz?
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-danger" type="submit">O'chirish</button>
        <a class="btn btn-outline-secondary" href="javascript:history.back()">Bekor qilish</a>
      </div>
    </form>
  </div>
{% endblock %}
